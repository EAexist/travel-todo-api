services:
  db-test:
    image: postgres:17.6
    container_name: test-postgres
    ports:
      - "5432:5432"
    environment:
      - "POSTGRES_DB=travel_todo_db_test"
      - "POSTGRES_USER=guest"
      - "POSTGRES_PASSWORD=hello_guest"
    volumes:
      - pgdata-test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  pgdata-test:
