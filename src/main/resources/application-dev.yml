spring:
  jpa:
    hibernate:
      #   ddl-auto: update
      ddl-auto: none
    # properties:
    #   hibernate:
    # dialect: org.hibernate.dialect.PostgreSQLDialect
    # "[format_sql]": true
    show_sql: true
  autoconfigure:
    exclude:
      - org.springframework.ai.model.vertexai.autoconfigure.gemini.VertexAiGeminiChatAutoConfiguration
  ssl:
    bundle:
      pem:
        dev-bundle:
          keystore:
            certificate: classpath:certs/travel-todo-api-455519588477.asia-northeast3.run.app.test+3.pem
            private-key: classpath:certs/travel-todo-api-455519588477.asia-northeast3.run.app.test+3-key.pem
logging:
  level:
    # root: DEBUG
    org:
      hibernate:
        sql: DEBUG
      springframework:
        security:
          web:
            FilterChainProxy: DEBUG
server:
  port: 8443
  ssl:
    bundle: dev-bundle
  servlet:
    session:
      timeout: 4h
app:
  cors:
    allowed-origins: https://localhost
