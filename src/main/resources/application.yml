spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
  datasource:
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      resourceserver:
        jwt:
          kakao:
            issuer-uri: https://kauth.kakao.com
          google:
            issuer-uri: https://accounts.google.com
  session:
    jdbc:
      initialize-schema: always
  cloud:
    gcp:
      project-id: ${SPRING_AI_VERTEX_AI_GEMINI_PROJECT_ID}
    #   credentials:
    # location: ${GCP_CREDENTIALS_LOCATION}
    # location: classpath:/certs/gc-service-account-key.json
  cache:
    jcache:
      provider: com.github.benmanes.caffeine.jcache.spi.CaffeineCachingProvider
    cache-names:
      - create-reservation-from-text-api-call-quota-cache
    caffeine:
      spec: maximumSize=100000,expireAfterAccess=30d
logging:
  level:
    org:
      springframework:
        security: DEBUG
app:
  quota:
    max-trips: 5
    max-trip-duration-days: 60
    max-destinations: 4
    max-todos: 64
    max-reservations: 64

# @TODO: use redis, not caffeine.
bucket4j:
  enabled: true
  filters:
    - cache-name: create-reservation-from-text-api-call-quota-cache
      url: ^/trip/[^/]+/reservation/analysis/text.*
      filter-method: servlet
      filter-order: 1
      rate-limits:
        # @TODO: use user account id as cache key (Current approach: ip address as cache key)
        - cache-key: "getRemoteAddr()"
          bandwidths:
            - capacity: 2
              time: 30
              unit: days
              refill-speed: interval
        #   execute-predicates:
        #     - METHOD=GET
        #     - METHOD=POST
