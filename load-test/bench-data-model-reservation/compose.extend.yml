services:
  target-spring-app:
    extends:
      file: ./compose.base.yml
      service: target-spring-app
    image: travel-todo-api:${TARGET_TAG}
    depends_on:
      db:
        condition: service_healthy
    environment:
      - "SPRING_PROFILES_ACTIVE=dev,no-security,load-test,bench-data-model-reservation"